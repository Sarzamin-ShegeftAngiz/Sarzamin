<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>انتخاب گروه | سرزمین شگفت‌انگیز</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family: Tahoma, Arial, sans-serif;
            background: #ffffff;
        }

        body {
            overflow-x: hidden;
        }

        .category-page {
            width: 100%;
            min-height: 100vh;
            padding: 35px 18px;
            background: #ffffff;
        }

        .main-title {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-top: 25px;
            margin-bottom: 10px;
            color: #111111;
        }

        .main-subtitle {
            text-align: center;
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 35px;
            color: #555555;
        }

        .group-buttons {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .group-button {
            display: block;
            width: 100%;
            padding: 18px 15px;
            margin: 14px 0;

            border: none;
            border-radius: 18px;

            background: #111111;
            color: #ffffff;

            font-family: Tahoma, Arial, sans-serif;
            font-size: 19px;
            font-weight: bold;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
        }

        .group-button:active {
            transform: scale(0.98);
        }

        .disabled {
            background: #d5d5d5;
            color: #888888;
            cursor: default;
        }

        .back-button {
            display: block;
            width: 100%;
            max-width: 500px;

            margin: 35px auto 0;
            padding: 14px;

            border: 2px solid #111111;
            border-radius: 16px;

            background: #ffffff;
            color: #111111;

            font-family: Tahoma, Arial, sans-serif;
            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
        }

        .back-button:active {
            transform: scale(0.98);
        }

    </style>
</head>

<body>

    <div class="category-page">

        <div class="main-title">
            انتخاب گروه
        </div>

        <div class="main-subtitle">
            گروه دفتر مورد نظرت رو انتخاب کن 👇
        </div>

        <div class="group-buttons">

            <button
                class="group-button"
                onclick="openGroup(1)">
                📚 دسته یک
            </button>

            <button
                class="group-button"
                onclick="openGroup(2)">
                🎨 دسته دو
            </button>

            <button
                class="group-button disabled"
                disabled>
                🔒 دسته سه
            </button>

            <button
                class="group-button disabled"
                disabled>
                🔒 دسته چهار
            </button>

            <button
                class="group-button disabled"
                disabled>
                🔒 دسته پنج
            </button>

        </div>

        <button
            class="back-button"
            onclick="goBack()">
            ‹ بازگشت
        </button>

    </div>


    <script>

        function openGroup(groupNumber) {

            if (groupNumber === 1) {

                window.location.href = "./Group1/index.html";

            }

            if (groupNumber === 2) {

                window.location.href = "./Group2/index.html";

            }

        }


        function goBack() {

            window.location.href = "./index.html";

        }

    </script>

</body>
</html>
