<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sarzamin AR</title>
<link rel="stylesheet" href="./style.css?v=200">
<style>
#groupMenu { position:fixed; inset:0; z-index:999999; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#7048ff,#40218a,#211044); font-family:Tahoma,Arial,sans-serif; }
#groupMenuBox { width:min(88%,380px); padding:32px 24px; box-sizing:border-box; text-align:center; border-radius:24px; background:rgba(255,255,255,.12); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
#groupMenuBox h1 { margin:0 0 10px; color:#fff; font-size:28px; }
#groupMenuBox p { margin:0 0 26px; color:rgba(255,255,255,.9); font-size:16px; }
#groupMenuBox button { display:block; width:100%; margin:12px 0; padding:16px; border:0; border-radius:16px; background:#fff; color:#40218a; font-size:20px; font-weight:bold; font-family:inherit; cursor:pointer; }
#groupMenuBox button:active { transform:scale(.97); }
</style>
</head>
<body>
<div id="groupMenu">
  <div id="groupMenuBox">
    <h1>سرزمین شگفت‌انگیز</h1>
    <p>گروه دفترها را انتخاب کنید</p>
    <button onclick="location.href='./Group1.html'">گروه ۱</button>
    <button onclick="location.href='./Group2.html'">گروه ۲</button>
    <button onclick="location.href='./Group3.html'">گروه ۳</button>
  </div>
</div>
</body>
</html>
