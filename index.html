<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sarzamin AR</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<script defer src="app.js?v=116"></script>

<style>

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
}

a-scene{
width:100%;
height:100%;
}

</style>

</head>


<body>


<a-scene

mindar-image="
imageTargetSrc: ./targets.mind;
"

embedded

vr-mode-ui="enabled:false"

device-orientation-permission-ui="enabled:false"

renderer="colorManagement:true;"
>


<a-assets>


<!-- ===================== -->
<!-- TARGET 0 -->
<!-- دفتر اول -->
<!-- ===================== -->

<video
id="video0"
src="./notebook/choromi.mp4"
preload="auto"
loop
muted
playsinline
webkit-playsinline>
</video>


<!-- ===================== -->
<!-- TARGET 1 -->
<!-- دفتر دوم -->
<!-- ===================== -->

<video
id="video1"
src="./notebook2/02.mp4"
preload="auto"
loop
muted
playsinline
webkit-playsinline>
</video>


</a-assets>



<a-camera
position="0 0 0"
look-controls="enabled:false">
</a-camera>



<!-- ===================== -->
<!-- TARGET 0 -->
<!-- ===================== -->

<a-entity
mindar-image-target="targetIndex:0">

<a-video
id="video0AR"
src="#video0"
width="1"
height="1.42"
position="0 0 0">
</a-video>

</a-entity>



<!-- ===================== -->
<!-- TARGET 1 -->
<!-- ===================== -->

<a-entity
mindar-image-target="targetIndex:1">

<a-video
id="video1AR"
src="#video1"
width="1"
height="1.42"
position="0 0 0">
</a-video>

</a-entity>



</a-scene>

</body>

</html>
