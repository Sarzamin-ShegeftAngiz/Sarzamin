    <!-- GROUP SELECTION -->
    <div id="groupMenu">
        <div id="groupMenuBox">
            <h1>سرزمین شگفت‌انگیز</h1>
            <p>گروه دفترها را انتخاب کنید</p>
            <button id="group1Btn">گروه ۱</button>
            <button id="group2Btn">گروه ۲</button>
        </div>
    </div>

    <style>
        #groupMenu {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            direction: rtl;
            font-family: Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #7048ff, #40218a, #211044);
        }

        #groupMenuBox {
            width: min(88%, 380px);
            padding: 32px 24px;
            box-sizing: border-box;
            text-align: center;
            border-radius: 24px;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        #groupMenuBox h1 {
            margin: 0 0 10px;
            color: white;
            font-size: 28px;
        }

        #groupMenuBox p {
            margin: 0 0 26px;
            color: rgba(255,255,255,0.9);
            font-size: 16px;
        }

        #groupMenuBox button {
            display: block;
            width: 100%;
            margin: 12px 0;
            padding: 16px;
            border: 0;
            border-radius: 16px;
            background: white;
            color: #40218a;
            font-size: 20px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
        }

        #groupMenuBox button:active {
            transform: scale(0.97);
        }

        #groupMenu.hidden {
            display: none;
        }
    </style>

<a-scene
    mindar-image="
        imageTargetSrc: ./Group1/targets.mind;
        autoStart: false;
        uiLoading: no;
        uiScanning: yes;
        uiError: no;
        warmupTolerance: 2;
        missTolerance: 1;
        filterMinCF: 0.0001;
        filterBeta: 0.001;
    "
    embedded
    color-space="sRGB"
    renderer="colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
>
