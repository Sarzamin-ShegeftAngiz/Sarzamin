<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Sarzamin AR</title>


<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<script defer src="app.js?v=119"></script>


<style>

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
}

a-scene{
width:100%;
height:100%;
}

</style>

</head>


<body>


<a-scene

mindar-image="
imageTargetSrc: ./targets.mind;
warmupTolerance: 2;
missTolerance: 1;
"

embedded

vr-mode-ui="enabled:false"

device-orientation-permission-ui="enabled:false"

renderer="colorManagement:true;"
>


<a-assets>


<video
id="video0"
src="./notebook/choromi.mp4"
preload="auto"
loop
muted
playsinline
webkit-playsinline>
</video>


<video
id="video1"
src="./notebook2/02.mp4"
preload="auto"
loop
muted
playsinline
webkit-playsinline>
</video>


<video
id="video2"
src="./notebook3/03.mp4"
preload="auto"
loop
muted
playsinline
webkit-playsinline>
</video>


<video
id="video3"
src="./notebook4/04.mp4"
preload="auto"
loop
muted
playsinline
webkit-playsinline>
</video>


<video
id="video4"
src="./notebook5/05.mp4"
preload="auto"
loop
muted
playsinline
webkit-playsinline>
</video>


<video
id="video5"
src="./notebook6/06.mp4"
preload="auto"
loop
muted
playsinline
webkit-playsinline>
</video>


</a-assets>


<a-camera
position="0 0 0"
look-controls="enabled:false">
</a-camera>



<!-- ===================== -->
<!-- TARGET 0 -->
<!-- ===================== -->

<a-entity
mindar-image-target="targetIndex:0">

<a-video
src="#video0"
width="1"
height="1.42"
position="0 0 0">
</a-video>


<!-- متن روی ویدئو -->

<a-text
class="surprise-text"
value="می‌خوای دوستاتو هم سورپرایز کنی؟ 😍👇"
align="center"
direction="rtl"
width="1.25"
position="0 -0.48 0.04"
color="white"
side="double"
visible="false">
</a-text>


<!-- Instagram -->

<a-text
class="live-text"
value="دفترهای زنده اینجا 👈"
align="center"
direction="rtl"
width="0.75"
position="-0.30 0.62 0.04"
color="white"
side="double"
visible="false">
</a-text>

<a-plane
class="instagram-zone"
width="0.70"
height="0.16"
position="-0.31 0.62 0.02"
material="
shader:flat;
color:red;
opacity:0;
transparent:true;
">
</a-plane>


<!-- Share -->

<a-text
value="سرزمین شگفت‌انگیز"
align="center"
direction="rtl"
width="0.70"
position="0 -0.62 0.03"
color="white"
side="double">
</a-text>


<a-plane
class="share-zone"
width="0.70"
height="0.16"
position="0 -0.62 0.02"
material="
shader:flat;
color:blue;
opacity:0;
transparent:true;
">
</a-plane>


</a-entity>
