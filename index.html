<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Sarzamin AR</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<script defer src="app.js?v=122"></script>

<style>

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
}

a-scene{
width:100%;
height:100%;
}

</style>

</head>


<body>


<a-scene

mindar-image="
imageTargetSrc: ./targets.mind;
"

embedded

vr-mode-ui="enabled:false"

device-orientation-permission-ui="enabled:false"

renderer="colorManagement:true;"

cursor="rayOrigin: mouse; fuse: false;"

raycaster="objects: .instagram-button;"
>


<a-assets>


<video
id="video0"
src="./notebook/choromi.mp4"
preload="auto"
loop
muted
playsinline
webkit-playsinline>
</video>


<video
id="video1"
src="./notebook2/02.mp4"
preload="auto"
loop
muted
playsinline
webkit-playsinline>
</video>


<video
id="video2"
src="./notebook3/03.mp4"
preload="auto"
loop
muted
playsinline
webkit-playsinline>
</video>


<video
id="video3"
src="./notebook4/04.mp4"
preload="auto"
loop
muted
playsinline
webkit-playsinline>
</video>


<video
id="video4"
src="./notebook5/05.mp4"
preload="auto"
loop
muted
playsinline
webkit-playsinline>
</video>


<video
id="video5"
src="./notebook6/06.mp4"
preload="auto"
loop
muted
playsinline
webkit-playsinline>
</video>


</a-assets>


<a-camera
position="0 0 0"
look-controls="enabled:false">

</a-camera>


<!-- TARGET 0 -->

<a-entity
mindar-image-target="targetIndex:0">

<a-video
src="#video0"
width="1"
height="1.42"
position="0 0 0">
</a-video>

<a-plane
class="instagram-button"
width="0.55"
height="0.16"
position="-0.22 0.63 0.05"
material="
shader:flat;
transparent:true;
opacity:0.01;
side:double;
">
</a-plane>

</a-entity>
