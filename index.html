        <a-video
            src="#video0"
            width="1"
            height="1.42"
            position="0 0 0">
        </a-video>

        <a-text
            class="after-video-text surprise-text"
            value="می‌خوای دوستاتو هم سورپرایز کنی؟ 😍👇"
            align="center"
            width="1.8"
            position="0 0.58 0.03">
        </a-text>

        <a-text
            class="after-video-text instagram-text"
            value="دفترهای زنده اینجا 👈"
            align="center"
            width="1.5"
            position="-0.30 0.62 0.03">
        </a-text>

        <a-plane
            class="instagram-zone"
            width="0.70"
            height="0.16"
            position="-0.31 0.62 0.02"
            material="transparent:true; opacity:0;">
        </a-plane>

            width="1.8"
            position="0 -0.62 0.03">

            width="0.9"
            height="0.18"
            position="0 -0.62 0.02"
            material="transparent:true; opacity:0;">
        </a-plane>
    </a-entity>
