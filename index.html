<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Sarzamin AR</title>


<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<script defer src="app.js?v=200"></script>


<style>

html,
body {

    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

}

a-scene {

    width: 100%;
    height: 100%;

}

</style>

</head>


<body>


<a-scene

    mindar-image="
        imageTargetSrc: ./targets.mind;
    "

    embedded

    vr-mode-ui="enabled:false"

    device-orientation-permission-ui="enabled:false"

    renderer="colorManagement:true;"
>


<a-assets>

<!-- ویدئوها توسط app.js ساخته می‌شوند -->

</a-assets>


<a-camera

    position="0 0 0"

    look-controls="enabled:false">

</a-camera>


<!--
    تارگت‌ها توسط app.js
    به صورت خودکار ساخته می‌شوند.
-->


</a-scene>


</body>

</html>
