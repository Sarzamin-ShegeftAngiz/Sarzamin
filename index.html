                   user-scalable=no">

    <title>Sarzamin AR</title>

    <link rel="stylesheet" href="./style.css?v=132">

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<body>


<a-scene

    id="arScene"

    mindar-image="
        imageTargetSrc: ./Group1/targets.mind;
        autoStart: true;
        uiLoading: yes;
        uiScanning: yes;
        uiError: yes;
        warmupTolerance: 2;
        missTolerance: 1;
        filterMinCF: 0.0001;
        filterBeta: 0.001;
    "

    embedded

    color-space="sRGB"

    renderer="
        colorManagement: true;
        alpha: true;
    "

    vr-mode-ui="enabled:false"

    device-orientation-permission-ui="enabled:false"

>


    <a-assets>

        <video
            id="arVideo"
            preload="none"
            loop
            playsinline
            webkit-playsinline>
        </video>

    </a-assets>


    <a-camera
        position="0 0 0"
        look-controls="enabled:false">
    </a-camera>


    <!-- TARGET 0 -->
    <a-entity mindar-image-target="targetIndex:0">
        <a-video
            class="arVideoPlane"
            src="#arVideo"
            width="1"
            height="1.42"
            position="0 0 0"
            visible="false">
        </a-video>
    </a-entity>
