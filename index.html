<!DOCTYPE html>
<html lang="fa">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>سرزمین شگفت انگیز</title>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Tahoma, Arial, sans-serif;
        }

        body {
            direction: rtl;

            background:
                linear-gradient(
                    135deg,
                    #7048ff,
                    #40218a,
                    #211044
                );

            display: flex;
            align-items: center;
            justify-content: center;
        }

        #groupMenu {
            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        #groupBox {
            width: 82%;
            max-width: 380px;

            padding: 30px 22px;

            text-align: center;

            background: rgba(255,255,255,0.12);

            border-radius: 25px;

            box-shadow:
                0 15px 40px rgba(0,0,0,0.35);

            backdrop-filter: blur(10px);
        }

        #groupBox h1 {
            color: white;

            font-size: 28px;

            margin:
                0
                0
                12px;
        }

        #groupBox p {
            color: white;

            font-size: 16px;

            margin:
                0
                0
                25px;
        }

        .groupButton {
            width: 100%;

            border: none;

            border-radius: 15px;

            padding: 17px;

            margin: 10px 0;

            background: white;

            color: #40218a;

            font-size: 19px;

            font-weight: bold;

            font-family:
                Tahoma,
                Arial,
                sans-serif;

            cursor: pointer;

            -webkit-tap-highlight-color:
                transparent;
        }

        .groupButton:active {
            transform: scale(0.97);
        }

    </style>

</head>

<body>

    <div id="groupMenu">

        <div id="groupBox">

            <h1>
                سرزمین شگفت انگیز
            </h1>

            <p>
                گروه دفترها را انتخاب کنید
            </p>

            <button
                class="groupButton"
                id="group1Btn">

                📚 گروه یک

            </button>

            <button
                class="groupButton"
                id="group2Btn">

                📚 گروه دو

            </button>

        </div>

    </div>


    <script>

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                document
                    .getElementById("group1Btn")
                    .addEventListener(
                        "click",
                        () => {

                            window.location.href =
                                "./Group1.html";

                        }
                    );


                document
                    .getElementById("group2Btn")
                    .addEventListener(
                        "click",
                        () => {

                            window.location.href =
                                "./Group2.html";

                        }
                    );

            }
        );

    </script>

</body>
</html>
